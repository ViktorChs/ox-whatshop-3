<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error del servidor | WhatShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/theme.css?v=37" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
      background: #fff;
      color: #171717;
    }
    .error-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(4rem, 15vw, 7rem);
      font-weight: 900;
      line-height: 1;
      color: #171717;
    }
    .error-code span { color: #16A34A; }
    .error-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.4rem; font-weight: 700; margin: 16px 0 8px; }
    .error-text { color: #666; max-width: 460px; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(0,0,0,0.1);
      border-top-color: #16A34A; border-radius: 50%;
      animation: spin 0.9s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #171717; color: #fff; padding: 14px 28px;
      border-radius: 12px; text-decoration: none; font-weight: 600; min-height: 48px;
    }
    .btn:hover { background: #16A34A; }
    .error-logo { width: 60px; height: 60px; object-fit: contain; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main class="error-page">
    <img class="error-logo" src="./assets/logos/logoB.png" alt="WhatShop" />
    <div class="spinner" role="status" aria-label="Cargando"></div>
    <div class="error-code">5<span>00</span></div>
    <div class="error-title">Error del servidor</div>
    <p class="error-text">Ocurrió un problema al cargar la tienda. Es posible que el servidor esté desconectado o temporalmente no disponible. Intenta de nuevo en unos momentos.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <a class="btn" href="./tienda.html">&larr; Reintentar</a>
      <a class="btn" href="./" style="background:#16A34A">Inicio</a>
    </div>
  </main>
</body>
</html>
