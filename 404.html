<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Página no encontrada | WhatShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/theme.css?v=37" />
  <link rel="stylesheet" href="./css/legal.css?v=37" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
      background: #fff;
      color: #171717;
    }
    .error-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 900;
      line-height: 1;
      color: #171717;
    }
    .error-code span { color: #16A34A; }
    .error-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      margin: 16px 0 8px;
    }
    .error-text { color: #666; max-width: 420px; margin-bottom: 24px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #171717;
      color: #fff;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      min-height: 48px;
    }
    .btn:hover { background: #16A34A; }
    .error-logo { width: 60px; height: 60px; object-fit: contain; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main class="error-page">
    <img class="error-logo" src="./assets/logos/logoB.png" alt="WhatShop" />
    <div class="error-code">4<span>0</span>4</div>
    <div class="error-title">Página no encontrada</div>
    <p class="error-text">La página que buscas no existe o fue movida. Vuelve a la tienda o al inicio para continuar.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <a class="btn" href="./tienda.html">&larr; Ir a la tienda</a>
      <a class="btn" href="./" style="background:#16A34A">Inicio</a>
    </div>
  </main>
</body>
</html>
