<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Producto - WhatShop</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" type="image/png" href="./assets/logos/logoB.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/theme.css?v=37" />
  <link rel="stylesheet" href="./css/tienda.css?v=79" />
  <link rel="stylesheet" href="./css/product.css?v=43" />
  <link rel="stylesheet" href="./css/product-desktop.css?v=41" />
</head>
<body class="shop-page product-page">

  <header class="top-header">
    <div class="top-header-inner">
      <div class="brand">
        <img id="brand-logo" src="./assets/logos/logoB.png" alt="Logo" />
        <h1 id="brand-name">WhatShop</h1>
      </div>
      <div class="header-actions">
        <nav class="top-nav" aria-label="Navegación principal">
          <button class="nav-item" data-tab="explore" aria-label="Explorar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span data-i18n="nav_explore">Explorar</span>
          </button>
          <button class="nav-item" data-tab="cart" aria-label="Carrito">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span data-i18n="nav_cart">Carrito</span>
          </button>
        </nav>
        <button class="icon-btn" id="lang-toggle" title="Idioma"><span id="lang-label" style="font-weight:700;font-size:.9rem">ES</span></button>
        <button class="icon-btn" id="theme-toggle" style="display:none" title="Tema">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="icon-btn" id="cart-open" title="Carrito" style="position:relative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span id="cart-badge" class="cart-badge hidden">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="product-page">
    <button class="p-back" id="btn-back">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span data-i18n="back">Volver a la tienda</span>
    </button>

    <nav class="crumbs" id="p-crumbs" aria-label="Ruta" style="margin-bottom:14px"></nav>

    <div id="p-loading" aria-busy="true">
    <div class="pl-skel" aria-hidden="true">
      <div class="pl-skel-gal">
        <div class="skel skel-thumb"></div>
        <div class="skel-thumbs">
          <div class="skel skel-thumb-sm"></div>
          <div class="skel skel-thumb-sm"></div>
          <div class="skel skel-thumb-sm"></div>
        </div>
      </div>
      <div class="pl-skel-buy">
        <div class="skel skel-line w20"></div>
        <div class="skel skel-line w60"></div>
        <div class="skel skel-line w80"></div>
        <div class="skel skel-line w35" style="height:26px"></div>
        <div class="skel skel-line w90"></div>
        <div class="skel skel-line w100"></div>
        <div class="skel skel-cta"></div>
      </div>
    </div>
  </div>

    <div class="p-layout hidden" id="p-content">
      <div class="p-gallery">
        <div class="p-thumbs" id="p-thumbs"></div>
        <div class="main">
          <img id="p-hero" src="" alt="" />
          <span class="p-badge-offer hidden" id="p-offer-badge" data-i18n="offer">Oferta</span>
        </div>
      </div>

      <div class="p-buy">
        <span class="p-badge" id="p-badge"></span>
        <div class="p-cat" id="p-cat"></div>
        <h1 id="p-name"></h1>
        <div class="p-price">
          <span class="now" id="p-price"></span>
          <span class="was hidden" id="p-was"></span>
          <span class="p-off hidden" id="p-off"></span>
        </div>
        <div class="p-desc" id="p-desc"></div>

        <div class="p-section" id="p-colors-sec">
          <h4 id="p-color-label" data-i18n="color">Color</h4>
          <div class="swatches" id="p-colors"></div>
        </div>

        <div class="p-section" id="p-sizes-sec">
          <h4><span id="p-size-label" data-i18n="size">Talla</span> <span class="p-size-guide" data-i18n="size_guide">Guía de tallas</span></h4>
          <div class="sizes" id="p-sizes"></div>
        </div>

        <div class="p-stock" id="p-stock"></div>

        <div class="p-cta-row">
          <button class="p-cta-add" id="p-cta-add" data-i18n="add_cart">Agregar al carrito</button>
          <button class="p-cta-buy" id="p-cta-buy" data-i18n="buy">Comprar ahora</button>
        </div>
      </div>
    </div>

    <section class="p-recs hidden" id="p-recs">
      <div class="pr-head">
        <h2 data-i18n="you_may_like">También te puede gustar</h2>
      </div>
      <div class="pr-grid" id="pr-grid"></div>
    </section>
  </main>

  <div class="p-bar hidden" id="p-bar">
    <div class="p-bar-left">
      <div class="p-bar-sel" id="p-bar-sel">Elige color y talla</div>
      <div class="p-bar-price" id="p-bar-price">$0.00</div>
    </div>
    <div class="p-bar-qty">
      <button id="qty-dec" aria-label="-">&minus;</button>
      <span id="qty-val">1</span>
      <button id="qty-inc" aria-label="+">+</button>
    </div>
    <button class="p-bar-cart" id="btn-cart-bar" title="Carrito" aria-label="Carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span id="cart-badge-bar" class="cart-badge hidden">0</span>
    </button>
    <button class="p-bar-add" id="btn-add-cart" data-i18n="bar_add">Agregar</button>
    <button class="p-bar-buy" id="btn-buy" data-i18n="bar_buy">Comprar</button>
  </div>

  <div class="cart-scrim" id="cart-scrim"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-head">
      <h3 data-i18n="cart">Carrito</h3>
      <button class="cart-close" id="cart-close" aria-label="Cerrar">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-foot">
      <div class="cart-total-row"><span data-i18n="total">Total</span><span class="amount" id="cart-total">$0.00</span></div>
      <button class="btn-checkout" id="go-checkout" data-i18n="checkout">Proceder al checkout</button>
    </div>
  </aside>

  <footer class="shop-footer">
    <div class="footer-inner">
      <div class="footer-brand"><img src="./assets/logos/logoB.png" alt="Logo WhatShop" /><span><span class="what">What</span><span class="shop">Shop</span></span></div>
      <div class="footer-links">
        <a href="./tienda.html?view=explore" data-i18n="back_shop">Volver a la tienda</a>
        <a href="./terminos.html" data-i18n="f_terminos">Términos y condiciones</a>
        <a href="./privacidad.html" data-i18n="f_privacidad">Política de privacidad</a>
        <a href="./politicas.html" data-i18n="f_politicas">Políticas de compra</a>
        <a href="./cookies.html" data-i18n="f_cookies">Política de cookies</a>
        <a href="./contacto.html" data-i18n="f_contacto">Contacto</a>
      </div>
      <div class="footer-copy"><span>&copy; <span id="footer-year"></span> <span id="footer-brand-name">WhatShop</span> · <span data-i18n="f_by">Plataforma de tienda de</span> OX1</span></div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="./config.js?v=41"></script>
  <script src="./js/supabase.js?v=45"></script>
  <script src="./js/cart.js?v=44"></script>
  <script src="./js/ox1-license.js?v=1"></script>
  <script src="./js/ox1-gate.js?v=7"></script>
  <script src="./js/product.js?v=42"></script>
</body>
</html>
