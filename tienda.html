    var lang = localStorage.getItem('whatshop_lang') === 'en' ? 'en' : 'es';

      return v != null ? v : key;

      document.documentElement.setAttribute('lang', lang);
      document.getElementById('lang-label').textContent = lang.toUpperCase();

    // ===== Tema =====

      document.documentElement.setAttribute('data-theme', mode);
      localStorage.setItem('whatshop_theme', mode);
      var sun = document.querySelector('.icon-sun'), moon = document.querySelector('.icon-moon');
      if (sun) sun.style.display = mode === 'dark' ? 'none' : '';
      if (moon) moon.style.display = mode === 'dark' ? '' : 'none';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', mode === 'dark' ? '#171717' : '#FFFFFF');
      applyGradient();

      var bIcon = ct.badge_icon_url;
      badge.innerHTML = bIcon
        ? '<img class="welcome-badge-icon" src="' + esc(bIcon) + '" alt="" />'
        : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 2.9 6.26L21 9.27l-4.5 4.38 1.06 6.6L12 17.35l-5.56 2.9 1.06-6.6L3 9.27l6.1-1.01Z"/></svg>';
      badge.insertAdjacentText('beforeend', ' ' + (ct.badge_text || ''));
      var ctaText = document.getElementById('wh-cta-text');
      ctaText.textContent = ct.button_text || 'Ir a la tienda';
      document.getElementById('wh-cta').style.display = ct.show_button_arrow === false ? '' : '';
      var arrow = document.querySelector('#wh-cta svg');
      if (arrow) arrow.style.display = ct.show_button_arrow === false ? 'none' : '';
      updateHomeTop();
    }

    // ===== Categorias circulares =====
    var CATEGORY_ICONS = {
      default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>',
      bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
      shoe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16c5 0 9-3 12-8 1-2 3-3 5-3 1 0 2 1 2 2 0 2-2 7-7 9H2"/><path d="M2 16v3h14v-3"/></svg>',
      ring: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M12 14v8M8 18h8"/></svg>',
      dress: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3l5 3 5-3 2 4-3 2v12H8V9L5 7Z"/></svg>',
      watch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><path d="M12 9v3l2 2M9 2h6M9 22h6"/></svg>',
      hat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c0-5 3-10 8-10s8 5 8 10"/><path d="M2 17h20v3H2z"/></svg>',
      tshirt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 7l3 4 3-2v12h6V9l3 2 3-4-6-4a3 3 0 0 0-6 0Z"/></svg>',
      jewel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l3 5-7 13L5 8Z"/><path d="M5 8h14"/></svg>',
      perfume: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v3H8zM6 9h12l-1 12H7Z"/><path d="M10 6v3M14 6v3"/></svg>',
      phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18h.01"/></svg>',
      home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
      sport: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9S14.5 18.5 12 21c-2.5-2.5-3.5-5.5-3.5-9S9.5 5.5 12 3Z"/></svg>',
      food: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1 12H5Z"/><path d="M9 8V4M15 8V4M12 8v12"/></svg>',
      car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.5-5h11L19 11"/><path d="M4 11h16v6H4z"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>',
      book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h14"/></svg>'
    };
    function renderCategoryCircles() {
      var box = document.getElementById('cat-circles');
      if (!box) return;
      var cats = (window.__store && window.__store.categories) || [];
      box.innerHTML = cats.map(function (c) {
        var active = _filters.cats.indexOf(String(c.id)) > -1;
        return '<button type="button" class="cat-circle' + (active ? ' active' : '') + '" data-main-cat="' + c.id + '">' + c.name + '</button>';
      }).join('');
      box.querySelectorAll('[data-main-cat]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = String(b.getAttribute('data-main-cat'));
          var cat = cats.find(function (c) { return String(c.id) === id; });
          var subsEl = document.getElementById('cat-subs');
          if (!cat || !subsEl) return;
          var subs = cat.subcategories || [];
          if (!subs.length) {
            var idx = _filters.cats.indexOf(id);
            if (idx > -1) _filters.cats.splice(idx, 1);
            else _filters.cats.push(id);
            subsEl.classList.add('hidden');
          } else {
            subsEl.classList.remove('hidden');
            subsEl.innerHTML = '<button type="button" class="fbtn' + (_filters.cats.indexOf(id) > -1 ? ' active' : '') + '" data-cat="' + id + '">' + t('cat_all') + ' ' + cat.name + '</button>' +
              subs.map(function (sc) {
                var scActive = _filters.subcats.indexOf(String(sc.id)) > -1;
                return '<button type="button" class="fbtn' + (scActive ? ' active' : '') + '" data-subcat="' + sc.id + '">' + sc.name + '</button>';
              }).join('');
            subsEl.querySelectorAll('[data-cat]').forEach(function (sb) {
              sb.addEventListener('click', function () {
                var cid = String(sb.getAttribute('data-cat'));
                var idx = _filters.cats.indexOf(cid);
                if (idx > -1) _filters.cats.splice(idx, 1);
                else _filters.cats.push(cid);
                _page = 1;
                renderFilterPanel();
                renderExplore();
              });
            });
            subsEl.querySelectorAll('[data-subcat]').forEach(function (sb) {
              sb.addEventListener('click', function () {
                var sid = String(sb.getAttribute('data-subcat'));
                var idx = _filters.subcats.indexOf(sid);
                if (idx > -1) _filters.subcats.splice(idx, 1);
                else _filters.subcats.push(sid);
                _page = 1;
                renderFilterPanel();
                renderExplore();
              });
            });
          }
          _page = 1;
          renderFilterPanel();
          renderExplore();
        });
      });
      updateCatScroll();
    }
    function updateCatScroll() {
      var track = document.getElementById('cat-circles');
      var nxt = document.getElementById('cat-scroll-btn');
      var prv = document.getElementById('cat-scroll-prev');
      if (!track) return;
      var more = track.scrollWidth > track.clientWidth + 4;
      if (nxt) nxt.classList.toggle('hidden', !more);
      if (prv) prv.classList.toggle('hidden', !more);
      if (!more) return;
      var atStart = track.scrollLeft <= 4;
      var atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 8;
      if (prv) prv.classList.toggle('hidden', atStart);
      if (nxt) nxt.classList.toggle('hidden', atEnd);
    }

    // ===== Explorar =====
    function renderExplore() {
      if (!catalogLoaded) return;
      var grid = document.getElementById('explore-grid');
      var all = storeProducts.filter(filterMatches);
      if (searchTerm) {
        var f = searchTerm.toLowerCase();
        all = all.filter(function (x) {
          var p = x.p;
          return (p.name || '').toLowerCase().indexOf(f) > -1 ||
                 (p.description || '').toLowerCase().indexOf(f) > -1 ||
                 (x.catName || '').toLowerCase().indexOf(f) > -1;
        });
      }
      var pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
      if (_page > pages) _page = 1;
      var list = all.slice((_page - 1) * PAGE_SIZE, _page * PAGE_SIZE);
      if (!list.length) { grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--secondary-text)">' + t('no_products') + '</p>'; renderPagination(0, 0); return; }
      grid.innerHTML = list.map(function (x, i) { return cardHtml(x, false, i); }).join('');
      wireCards(grid);
      grid.querySelectorAll('[data-add-card]').forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var id = Number(b.getAttribute('data-add-card'));
          var x = storeProducts.find(function (it) { return it.p.id === id; });
          if (!x) return;
          if (prodStock(x.p) <= 0) { toast(t('out'), 'error'); return; }
          var imgs = prodImages(x.p);
          CART.addItem({ id: x.p.id, title: x.p.name, price: Number(x.p.price) || 0, image: imgs[0] || null }, { qty: 1, maxStock: prodStock(x.p) });
          toast(t('added'), 'success');
          b.classList.add('added');
          b.textContent = '\u2713';
          setTimeout(function () { b.classList.remove('added'); b.textContent = '+'; }, 800);
        });
      });
      renderPagination(all.length > PAGE_SIZE ? pages : 0, _page);
    }

    function renderPagination(total, cur) {
      var box = document.getElementById('explore-pagination');
      if (!box) return;
      if (!total || !cur || total <= 1) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      box.classList.remove('hidden');
      var html = cur > 1 ? '<button class="page-btn" data-page="' + (cur - 1) + '" aria-label="Anterior">&laquo;</button>' : '<button class="page-btn" disabled aria-label="Anterior">&laquo;</button>';
      var nums = [];
      for (var i = 1; i <= total; i++) {
        if (i === 1 || i === total || Math.abs(i - cur) <= 1) nums.push(i);
        else if (nums[nums.length - 1] !== '...') nums.push('...');
      }
      html += nums.map(function (n) {
        return n === '...' ? '<span class="page-btn" style="border:none;background:transparent;cursor:default">&hellip;</span>' : '<button class="page-btn' + (n === cur ? ' active' : '') + '" data-page="' + n + '">' + n + '</button>';
      }).join('');
      html += cur < total ? '<button class="page-btn" data-page="' + (cur + 1) + '" aria-label="Siguiente">&raquo;</button>' : '<button class="page-btn" disabled aria-label="Siguiente">&raquo;</button>';
      box.innerHTML = html;
      box.querySelectorAll('[data-page]').forEach(function (b) {
        b.addEventListener('click', function () { _page = Number(b.getAttribute('data-page')); renderExplore(); });
      });
    }

    function enterStore() {
      document.body.classList.add('in-store');
      var hero = document.getElementById('welcome-hero');
      var explore = document.getElementById('explore-view');
      var banner = document.querySelector('.promo-banner');
      if (hero) hero.classList.add('hidden');
      if (banner) banner.classList.add('hidden');
      if (explore) explore.classList.remove('hidden');
      updateHomeTop();
      renderExplore();
    }

    // ===== Init =====
    applyLang();
    CART.wire();
    CART.updateBadge();

    function goStoreBtn() { var pl = document.getElementById('page-loader'); if (pl) pl.classList.remove('hidden'); window.location.href = './tienda.html?view=explore'; }

    // Hero de bienvenida: CTA
    var whCta = document.getElementById('wh-cta');
    if (whCta) whCta.addEventListener('click', function () {
      var link = ((heroConfig().content || {}).button_link || '#catalogo').trim();
      if (link && link !== '#' && link.indexOf('#') !== 0) { window.location.href = link; return; }
      goStoreBtn();
    });

    // Filtros
    var filterPanelEl = document.getElementById('filter-panel');
    var filterScrim = document.getElementById('filter-scrim');
    function closeFilters() { filterPanelEl.classList.remove('open'); filterScrim.classList.remove('open'); document.body.classList.remove('filter-open'); }
    function openFilters() { filterPanelEl.classList.add('open'); filterScrim.classList.add('open'); document.body.classList.add('filter-open'); }
    var filterToggle = document.getElementById('filter-toggle');
    if (filterToggle) filterToggle.addEventListener('click', function () {
      if (filterPanelEl.classList.contains('open')) closeFilters();
      else openFilters();
    });
    var filterClose = document.getElementById('filter-close');
    if (filterClose) filterClose.addEventListener('click', closeFilters);
    if (filterScrim) filterScrim.addEventListener('click', closeFilters);
    document.querySelectorAll('.filter-group-head').forEach(function (h) {
      h.addEventListener('click', function () {
        var g = h.closest('.filter-group');
        g.classList.toggle('collapsed');
        h.setAttribute('aria-expanded', g.classList.contains('collapsed') ? 'false' : 'true');
      });
    });
    var filterClear = document.getElementById('filter-clear');
    if (filterClear) filterClear.addEventListener('click', clearFilters);
    var fMin = document.getElementById('filter-min');
    var fMax = document.getElementById('filter-max');
    var mr = document.getElementById('filter-min-range');
    var xr = document.getElementById('filter-max-range');
    function priceMax() {
      var m = 1000;
      storeProducts.forEach(function (x) { var pr = Number(x.p.price) || 0; if (pr > m) m = Math.ceil(pr); });
      return m;
    }
    function applyPrice() {
      var a = Math.round(Number(fMin.value)), b = Math.round(Number(fMax.value));
      _filters.min = isNaN(a) || a === 0 ? null : a;
      _filters.max = isNaN(b) || b === 0 ? null : b;
      fMin.value = isNaN(a) ? '' : a;
      fMax.value = isNaN(b) ? '' : b;
      if (mr) mr.value = _filters.min != null ? _filters.min : 0;
      if (xr) xr.value = _filters.max != null ? _filters.max : _priceMax;
      _page = 1;
      renderExplore();
    }
    if (mr && xr) {
      _priceMax = priceMax();
      mr.max = xr.max = _priceMax;
      xr.value = _priceMax;
      mr.addEventListener('input', function () { var v = Number(mr.value); var x = Number(xr.value); if (v > x) mr.value = x; fMin.value = mr.value; fMax.value = xr.value; });
      xr.addEventListener('input', function () { var v = Number(xr.value); var m = Number(mr.value); if (v < m) xr.value = m; fMin.value = mr.value; fMax.value = xr.value; });
      mr.addEventListener('change', applyPrice);
      xr.addEventListener('change', applyPrice);
    }
    if (fMin) fMin.addEventListener('change', function () { if (xr) xr.value = fMin.value; applyPrice(); });
    if (fMax) fMax.addEventListener('change', function () { if (mr) mr.value = fMax.value; applyPrice(); });
    var priceApply = document.getElementById('price-apply');
    if (priceApply) priceApply.addEventListener('click', applyPrice);

    document.getElementById('search-input').addEventListener('input', function (e) {
      searchTerm = e.target.value;
      _page = 1;
      renderExplore();
    });
    document.getElementById('lang-toggle').addEventListener('click', function () {
      lang = lang === 'es' ? 'en' : 'es';
      localStorage.setItem('whatshop_lang', lang);
      applyLang();
    });
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      applyThemeMode(cur === 'dark' ? 'light' : 'dark');
    });

    var allNav = document.querySelectorAll('.nav-item');
    allNav.forEach(function (item) {
      item.addEventListener('click', function () {
        var tab = item.getAttribute('data-tab');
        if (tab === 'cart') { CART.openCart(); return; }
        allNav.forEach(function (i) { i.classList.remove('active'); i.removeAttribute('aria-current'); });
        item.classList.add('active');
        item.setAttribute('aria-current', 'page');
        if (tab === 'explore') enterStore();
      });
    });

    function on(id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }
    on('cart-open', 'click', CART.openCart);

    // Categorias circulares: botones "<" y ">" para ver mas
    var catTrack = document.getElementById('cat-circles');
    var catBtn = document.getElementById('cat-scroll-btn');
    var catPrev = document.getElementById('cat-scroll-prev');
    if (catTrack && catBtn) catBtn.addEventListener('click', function () { catTrack.scrollBy({ left: 340, behavior: 'smooth' }); });
    if (catTrack && catPrev) catPrev.addEventListener('click', function () { catTrack.scrollBy({ left: -340, behavior: 'smooth' }); });
    if (catTrack) catTrack.addEventListener('scroll', updateCatScroll, { passive: true });
    window.addEventListener('resize', updateCatScroll);

    // ===== Boton arriba/abajo =====
    var scrollBtn = document.getElementById('scroll-btn');
    var scrollUpIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>';
    var scrollDownIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>';
    function updateScrollBtn() {
      if (!scrollBtn) return;
      if (window.scrollY > 120) { scrollBtn.classList.remove('hidden'); scrollBtn.innerHTML = scrollUpIcon; }
      else { scrollBtn.classList.add('hidden'); scrollBtn.innerHTML = scrollDownIcon; }
    }
    window.addEventListener('scroll', updateScrollBtn, { passive: true });
    updateScrollBtn();
    if (scrollBtn) scrollBtn.addEventListener('click', function () {
      if (window.scrollY > 120) window.scrollTo({ top: 0, behavior: 'smooth' });
      else window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });

    // ===== Pantalla de carga entre paginas =====
    var pageLoader = document.getElementById('page-loader');
    function hidePageLoader() {
      if (pageLoader) pageLoader.classList.add('hidden');
      document.body.classList.add('ready');
    }
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]');
      var card = e.target.closest('[data-open]');
      if (a && a.getAttribute('href') && a.getAttribute('href').indexOf('#') !== 0) {
        if (pageLoader) pageLoader.classList.remove('hidden');
      } else if (card) {
        if (pageLoader) pageLoader.classList.remove('hidden');
      }
    });
    setTimeout(hidePageLoader, 7000);

    // ===== Animaciones: fade on scroll =====
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduced && 'IntersectionObserver' in window) {
      var revealObs = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add('visible'); revealObs.unobserve(en.target); }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.reveal').forEach(function (el) { revealObs.observe(el); });
    } else {
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('visible'); });
    }
  </script>
</body>
</html>
